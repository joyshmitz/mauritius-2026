 <\u002Ful>\n      <ul class=\"dash\" style=\"margin-top: 0\">\n        <li>Мавриканський: роті з каррі з учорашньої вечері<\u002Fli>\n        <li>Французький: круасани із Super U + сири + кава<\u002Fli>\n        <li>«Рибний день»: смажена дорадо + рис — кайтерам паливо перед сесією<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <h3 class=\"h3\">Вечері<\u002Fh3>\n    <p class=\"small\" style=\"max-width: var(--measure)\">Половину готуємо самі з місцевого: salade d’ourite, рибне каррі, rougaille, vindaye, гриль-марлін, cœur de palmiste — усі спеції є в London Way. Доставки в Ле-Морні фактично немає — розраховуємо на самовивіз. Чайові необовʼязкові: 5–10% або округлити.<\u002Fp>\n    <div class=\"tablewrap\"><table class=\"table\">\n      <thead><tr><th style=\"width:22%\">Рівень<\u002Fth><th>Де<\u002Fth><th style=\"width:22%\">Чек на особу<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td>Прості локальні<\u002Ftd><td>Chez Bhim · Chez BB · Emba Filao на пляжі — у пʼятницю бронювати<\u002Ftd><td class=\"num\">Rs 150–400<\u002Ftd><\u002Ftr>\n        <tr><td>Середні<\u002Ftd><td>ENSO · Ocean Vibes · Wapalapam · Heritage Sunset<\u002Ftd><td class=\"num\">Rs 400–900<\u002Ftd><\u002Ftr>\n        <tr><td>Особлива нагода<\u002Ftd><td>East у LUX* · Blue Marlin у Paradis<\u002Ftd><td class=\"num\">Rs 2000–4000<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n\n    <h3 class=\"h3\">Гастро-виїзди <small>те, що запамʼятається<\u002Fsmall><\u002Fh3>\n    <ul class=\"dash\">\n      <li><b>Mahébourg market, понеділок 5.10, 7:00–16:00<\u002Fb> — головний стріт-фуд день: dholl puri, gato pima, mine bouille, alouda<\u002Fli>\n      <li><b>Port Louis<\u002Fb> — Central Market зранку (dholl puri Rs 25–35, alouda Pillay) → Chinatown на ланч: boulettes у Mr Boulettes, mine frit<\u002Fli>\n      <li><b>Chamarel<\u002Fb> — «La Table Créole» у Le Chamarel Panoramic (креольський стіл із панорамою, Rs 2250–3000, бронь за 48 год) або table d’hôte <b>Le Palais de Barbizon<\u002Fb> у Ріко (+230 483 4178, телефонувати заздалегідь) + ланч L’Alchimiste на дистилерії<\u002Fli>\n    <\u002Ful>\n\n    <h3 class=\"h3\">Must-try чекліст <small>відмічаємо на місці<\u002Fsmall><\u002Fh3>\n    <ul class=\"check cols\">\n      <li data-check=\"try-dhollpuri\"><span class=\"box\"><\u002Fspan><span>dholl puri<\u002Fspan><\u002Fli>\n      <li data-check=\"try-roti\"><span class=\"box\"><\u002Fspan><span>roti chaud<\u002Fspan><\u002Fli>\n      <li data-check=\"try-gateaux\"><span class=\"box\"><\u002Fspan><span>gateaux piments<\u002Fspan><\u002Fli>\n      <li data-check=\"try-boulettes\"><span class=\"box\"><\u002Fspan><span>boulettes<\u002Fspan><\u002Fli>\n      <li data-check=\"try-minefrit\"><span class=\"box\"><\u002Fspan><span>mine frit<\u002Fspan><\u002Fli>\n      <li data-check=\"try-rougaille\"><span class=\"box\"><\u002Fspan><span>rougaille<\u002Fspan><\u002Fli>\n      <li data-check=\"try-vindaye\"><span class=\"box\"><\u002Fspan><span>vindaye<\u002Fspan><\u002Fli>\n      <li data-check=\"try-ourite\"><span class=\"box\"><\u002Fspan><span>salade d’ourite<\u002Fspan><\u002Fli>\n      <li data-check=\"try-palmiste\"><span class=\"box\"><\u002Fspan><span>cœur de palmiste<\u002Fspan><\u002Fli>\n      <li data-check=\"try-briani\"><span class=\"box\"><\u002Fspan><span>briani<\u002Fspan><\u002Fli>\n      <li data-check=\"try-alouda\"><span class=\"box\"><\u002Fspan><span>alouda<\u002Fspan><\u002Fli>\n      <li data-check=\"try-arrange\"><span class=\"box\"><\u002Fspan><span>аранже — ромові настоянки<\u002Fspan><\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <hr class=\"rule\">\n  <section class=\"sec\" id=\"money\">\n    <span class=\"kicker\">Гроші · без сюрпризів<\u002Fspan>\n    <h2 class=\"sec-title\">Спільне — порівну, особисте — кожен за себе<\u002Fh2>\n    <p class=\"lead\">І жодних перерахунків заднім числом. Курс для орієнтиру: ≈ 50–52 MUR/€.<\u002Fp>\n\n    <div class=\"tablewrap\" style=\"margin-top: var(--leading)\"><table class=\"table\">\n      <thead><tr><th>Стаття<\u002Fth><th style=\"width:30%\">€ на особу, орієнтовно<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td>Авіа RMO–MRU туди-назад<\u002Ftd><td class=\"num\">850–1200<\u002Ftd><\u002Ftr>\n        <tr><td>Кайт-багаж, якщо веземо своє — на двох кайтерів<\u002Ftd><td class=\"num\">+250–550 кожному з двох<\u002Ftd><\u002Ftr>\n        <tr><td>Мікроавтобус Миколаїв–Кишинів ×2, на шістьох<\u002Ftd><td>за домовленістю<\u002Ftd><\u002Ftr>\n        <tr><td>Страховка (кайтерам — зі спорт-опцією)<\u002Ftd><td class=\"num\">30–90<\u002Ftd><\u002Ftr>\n        <tr><td>Житло: вілла на 6, 14 ночей<\u002Ftd><td>за нашою бронню<\u002Ftd><\u002Ftr>\n        <tr><td>Авто ×2 + бензин, на шістьох<\u002Ftd><td class=\"num\">~130–180<\u002Ftd><\u002Ftr>\n        <tr><td>Їжа: продукти + ресторани + гастро-виїзди<\u002Ftd><td class=\"num\">~300–450<\u002Ftd><\u002Ftr>\n        <tr><td>Активності: катамаран, хайк, каньйонінг, квади…<\u002Ftd><td class=\"num\">~200–350<\u002Ftd><\u002Ftr>\n        <tr><td>Кайт-сервіси: оренда/rescue, на двох кайтерів<\u002Ftd><td class=\"num\">~50–150 кожному з двох<\u002Ftd><\u002Ftr>\n        <tr class=\"total\"><td>Разом без житла<\u002Ftd><td class=\"num\">~1600–2400<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n\n    <h3 class=\"h3\">Правила<\u002Fh3>\n    <div class=\"tablewrap\"><table class=\"table\">\n      <thead><tr><th style=\"width:18%\">Категорія<\u002Fth><th>Що сюди входить<\u002Fth><th style=\"width:30%\">Як платимо<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td>Спільне<\u002Ftd><td>Вілла, авто, пальне, туристичний збір, базові продукти, вода, побутові дрібниці<\u002Ftd><td>Порівну, зі спільної каси (kitty)<\u002Ftd><\u002Ftr>\n        <tr><td>Особисте<\u002Ftd><td>Розваги, алкоголь, покупки, апгрейди, особисті медичні чи спортивні доплати<\u002Ftd><td>Кожен за себе<\u002Ftd><\u002Ftr>\n        <tr><td>Зміна плану<\u002Ftd><td>Доплата чи втрата коштів через особисте рішення одного з нас<\u002Ftd><td>На групу не перекладається без окремої згоди<\u002Ftd><\u002Ftr>\n        <tr><td>Резерв<\u002Ftd><td>Непередбачені групові витрати<\u002Ftd><td>Сума: <input class=\"blank\" data-store=\"money.reserve\" placeholder=\"___\" style=\"width:80px\"> · валюта: <input class=\"blank\" data-store=\"money.currency\" placeholder=\"___\" style=\"width:60px\"><\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n\n    <div class=\"g2\" style=\"margin-top: var(--half)\">\n      <div class=\"card roomy elev-sm\">\n        <div class=\"t\">Облік<\u002Fdiv>\n        <ul class=\"dash\">\n          <li>Журнал витрат веде <input class=\"blank\" data-store=\"money.keeper\" placeholder=\"імʼя\" style=\"width:110px\"><\u002Fli>\n          <li>Застосунок або таблиця: <input class=\"blank\" data-store=\"money.app\" placeholder=\"—\" style=\"width:130px\"><\u002Fli>\n          <li>Звіряємось кожні <input class=\"blank\" data-store=\"money.days\" placeholder=\"__\" style=\"width:36px\"> днів<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"note\" style=\"margin-top: 0\">\n        <p class=\"nk\">Про що вже знаємо<\u002Fp>\n        <p>Туристичний збір — 3 € з дорослого за ніч. На шістьох за 14 ночей це <b>252 €<\u002Fb>, якщо збір не включено у вартість вілли. Питання стоїть у листі господарю.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr class=\"rule\">\n  <section class=\"sec\" id=\"villa\">\n    <span class=\"kicker\">Вілла · перед оплатою<\u002Fspan>\n    <h2 class=\"sec-title\">Одне повідомлення закриває все<\u002Fh2>\n    <p class=\"lead\">Місце чудове — тепер переконаймося, що воно безпечне і зручне саме для шістьох: датчики диму, кондиціонери в спальнях, вода й резерв, паркування на два авто, сейф, прибирання, туристичний збір.<\u002Fp>\n\n    <details>\n      <summary>Готовий лист господарю — розгорнути<\u002Fsummary>\n      <div class=\"inner\" id=\"letter-text\">\n        <p>Вітаємо! Ми приїжджаємо групою з шести дорослих 28 вересня — 12 жовтня 2026 року. Щоб завершити підготовку, просимо письмово уточнити кілька деталей:<\u002Fp>\n        <ol>\n          <li>Чи можете встановити й перевірити датчики диму та чадного газу до нашого прибуття? Коли востаннє перевіряли вогнегасник?<\u002Fli>\n          <li>Чи є кондиціонер у кожній спальні? Скільки окремих спалень розраховано на шістьох дорослих?<\u002Fli>\n          <li>Скільки є туалетів, душів і водонагрівачів? Чи можуть одночасно працювати два душі з гарячою водою?<\u002Fli>\n          <li>Чи можна пити воду з крана? Чи є фільтр, запас бутильованої води або резервний бак? Що відбувається під час відключення води чи електрики?<\u002Fli>\n          <li>Чи поміщаються два орендовані автомобілі всередині території та чи замикаються ворота?<\u002Fli>\n          <li>Чи є резервне живлення для холодильника, інтернету й основного освітлення? Який тип інтернет-підключення та швидкість?<\u002Fli>\n          <li>Чи є пляжні рушники, пральний засіб, таблетки для посудомийної машини, прищіпки та достатньо місця для сушіння?<\u002Fli>\n          <li>Чи є сейф? Скільки комплектів ключів і хто з персоналу має доступ до будинку?<\u002Fli>\n          <li>Що саме означає «прибирання 6 годин щодня»: у який час приходить персонал, чи миють посуд і гриль, змінюють рушники та виносять сміття?<\u002Fli>\n          <li>Яка глибина басейну, як його обслуговують та освітлюють? Чи є огорожа або сигналізація?<\u002Fli>\n          <li>Скільки коштує доступ до курорту, що входить у вартість, чи є стоянка й рушники, які години роботи та чи потрібне бронювання?<\u002Fli>\n          <li>Чи включено туристичний збір 3 євро за дорослого за ніч? Чи можна після виселення залишити багаж у зачиненому приміщенні та прийняти душ?<\u002Fli>\n        <\u002Fol>\n        <p>Дякуємо! Просимо, якщо можливо, додати фото датчиків, паркування та спалень.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdetails>\n    <p style=\"margin: var(--half) 0 0\"><button type=\"button\" class=\"btn btn-secondary\" id=\"copy-letter\">Скопіювати лист<\u002Fbutton><\u002Fp>\n\n    <h3 class=\"h3\">Перші 30 хвилин після заселення <small>і лише потім — велика закупівля<\u002Fsmall><\u002Fh3>\n    <ul class=\"check cols\">\n      <li data-check=\"villa-photos\"><span class=\"box\"><\u002Fspan><span>Сфотографувати кімнати, техніку, басейн, паркування і всі наявні пошкодження<\u002Fspan><\u002Fli>\n      <li data-check=\"villa-fire\"><span class=\"box\"><\u002Fspan><span>Знайти вогнегасник і датчики: пломба, строк, робота<\u002Fspan><\u002Fli>\n      <li data-check=\"villa-gas\"><span class=\"box\"><\u002Fspan><span>Газова плита, вентиляція, відсутність запаху газу<\u002Fspan><\u002Fli>\n      <li data-check=\"villa-ac\"><span class=\"box\"><\u002Fspan><span>Увімкнути кондиціонери в усіх спальнях<\u002Fspan><\u002Fli>\n      <li data-check=\"villa-shower\"><span class=\"box\"><\u002Fspan><span>Два душі одночасно — чи тримає гаряча вода<\u002Fspan><\u002Fli>\n      <li data-check=\"villa-locks\"><span class=\"box\"><\u002Fspan><span>Замки, ворота, сейф, усі комплекти ключів<\u002Fspan><\u002Fli>\n      <li data-check=\"villa-wifi\"><span class=\"box\"><\u002Fspan><span>Wi-Fi у спальнях<\u002Fspan><\u002Fli>\n      <li data-check=\"villa-kitchen\"><span class=\"box\"><\u002Fspan><span>Холодильник, морозильник, посудомийна і пральна машини<\u002Fspan><\u002Fli>\n      <li data-check=\"villa-schedule\"><span class=\"box\"><\u002Fspan><span>Графік прибирання, заміни рушників, сміття, доступ персоналу<\u002Fspan><\u002Fli>\n      <li data-check=\"villa-shop\"><span class=\"box\"><\u002Fspan><span>Тоді — великий закуп: London Way / Super U<\u002Fspan><\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <hr class=\"rule\">\n  <section class=\"sec\" id=\"bags\">\n    <span class=\"kicker\">Валізи · формула проста<\u002Fspan>\n    <h2 class=\"sec-title\">Одна валіза на людину — і все влазить<\u002Fh2>\n    <p class=\"lead\">По одній зареєстрованій валізі, мʼякі рюкзаки замість жорстких кейсів у салон — тоді два авто вміщують і людей, і багаж.<\u002Fp>\n\n    <div class=\"g2\" style=\"margin-top: var(--leading)\">\n      <div class=\"card roomy elev-sm\">\n        <div class=\"t\">Як пакуємось<\u002Fdiv>\n        <ul class=\"dash\">\n          <li>Одна середня зареєстрована валіза на людину<\u002Fli>\n          <li>У салон — мʼякі рюкзаки: легше розмістити в авто<\u002Fli>\n          <li>У кожного в салоні — речі на першу добу<\u002Fli>\n          <li>Речі кожної пари розподілені між двома валізами<\u002Fli>\n          <li>Мітки відстеження і контактний аркуш у кожній валізі<\u002Fli>\n          <li>Кайтери: захисне з собою, кайти й дошки — оренда<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card roomy elev-sm\">\n        <div class=\"t\">Тест «чи влазимо»<\u002Fdiv>\n        <p class=\"small\">Кожне авто вміщує <b>3 людей + 3 валізи + 3 мʼякі сумки + воду на дорогу<\u002Fb>. Тест пройдено, якщо:<\u002Fp>\n        <ul class=\"dash\">\n          <li>заднє скло не перекрите, ніщо не лежить на колінах<\u002Fli>\n          <li>цінності не видно зовні<\u002Fli>\n          <li>багажник закривається без зусилля<\u002Fli>\n          <li>у салоні немає незакріплених важких речей<\u002Fli>\n        <\u002Ful>\n        <p class=\"small\">Зʼявляються довгі кайт-сумки → одразу мінівен або окреме перевезення багажу з MRU.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card roomy elev-sm\">\n        <div class=\"t\">У салон літака<\u002Fdiv>\n        <ul class=\"dash\">\n          <li>Паспорт, гроші, картки, страховка<\u002Fli>\n          <li>Особисті ліки на всю подорож + запас 3–5 днів<\u002Fli>\n          <li>Телефон, ноутбук, камера, зарядки<\u002Fli>\n          <li>Комплект білизни, легкий одяг, купальник<\u002Fli>\n          <li>Мінімум гігієни, захист від сонця й комах у дозволеному обʼємі<\u002Fli>\n          <li>Порожня пляшка для води<\u002Fli>\n          <li><b>Павербанки — лише в салон<\u002Fb>, за правилами перевізника<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card roomy elev-sm\">\n        <div class=\"t\">У зареєстрований багаж<\u002Fdiv>\n        <ul class=\"dash\">\n          <li>Леза, стропоріз, усе гостре<\u002Fli>\n          <li>Великі рідини й аерозолі, дозволені перевізником<\u002Fli>\n          <li>Кайт-ремкомплект без акумуляторів<\u002Fli>\n          <li>Спортивне спорядження — чисте й сухе, без залишків ґрунту: митна вимога Маврикію<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"h3\">Взяти · купити · не везти<\u002Fh3>\n    <div class=\"tablewrap\"><table class=\"table\">\n      <thead><tr><th>Взяти з дому<\u002Fth><th>Купити на місці<\u002Fth><th>Не везти<\u002Fth><th>Спершу уточнити<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td>Ліки, рецепти, аптечка<\u002Ftd><td>Шампунь, пральний засіб<\u002Ftd><td>Фен і праску<\u002Ftd><td>Пляжні рушники<\u002Ftd><\u002Ftr>\n        <tr><td>Перехідники (тип G), багажна вага<\u002Ftd><td>Великі упаковки SPF і репеленту<\u002Ftd><td>Посуд, чайник, тостер<\u002Ftd><td>Питну воду / фільтр<\u002Ftd><\u002Ftr>\n        <tr><td>Вітровка, взуття для коралів, гермомішок<\u002Ftd><td>Вода, лід, базові продукти<\u002Ftd><td>Постіль, великі запаси їжі<\u002Ftd><td>Сейф, москітні сітки<\u002Ftd><\u002Ftr>\n        <tr><td>Мітки для багажу, копії документів<\u002Ftd><td>Пакети, папір, таблетки для посудомийки<\u002Ftd><td>Вугілля, побутову техніку<\u002Ftd><td>Датчики, резервне живлення<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n\n    <div class=\"note\">\n      <p class=\"nk\">Про норми ваги<\u002Fp>\n      <p>Остаточні норми — з конкретного квитка й авіакомпанії, що фактично виконує рейс. Якщо дозволено 23 кг — пакуємось на <b>20–21 кг<\u002Fb>: похибка ваг і сувеніри скажуть дякую.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr class=\"rule\">\n  <section class=\"sec\" id=\"safety\">\n    <span class=\"kicker\">Безпека · трохи занудства<\u002Fspan>\n    <h2 class=\"sec-title\">Щоб решта розділів були веселими<\u002Fh2>\n    <p class=\"lead\">Страховка, правила виходу на воду і здоровʼя — три речі, які перевіряємо без компромісів.<\u002Fp>\n\n    <div class=\"g2\" style=\"margin-top: var(--leading)\">\n      <div class=\"card roomy elev-sm\">\n        <div class=\"t\">Страховка кожного покриває<\u002Fdiv>\n        <ul class=\"dash\">\n          <li>Невідкладну допомогу й лікування в лікарні<\u002Fli>\n          <li>Медичне перевезення або повернення додому<\u002Fli>\n          <li>Цілодобову підтримку<\u002Fli>\n          <li>Зрозумілий порядок оплати: напряму чи відшкодування<\u002Fli>\n        <\u002Ful>\n        <p class=\"small\"><b>Кайтерам:<\u002Fb> кайтсерфінг прямо названий у полісі або доданий розширенням для водних видів спорту. Усне запевнення продавця — не аргумент. Окремо: франшизи й винятки, рятувальні роботи на воді, ушкодження орендованого спорядження, франшиза на авто.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card roomy elev-sm\">\n        <div class=\"t\">Катаємось, лише коли все «так»<\u002Fdiv>\n        <ul class=\"dash\">\n          <li>Немає офіційних попереджень про хвилі чи погоду<\u002Fli>\n          <li>Стан моря відповідає рівню райдера<\u002Fli>\n          <li>Спорядження перевірене<\u002Fli>\n          <li>Є звʼязок і зрозумілий план повернення<\u002Fli>\n          <li>Ніхто не катається хворим, виснаженим чи після алкоголю<\u002Fli>\n        <\u002Ful>\n        <p class=\"small\"><b>Здоровʼя:<\u002Fb> репелент — також удень. Гарячка, висип чи біль у суглобах → день паузи + дзвінок страховій. Ситуацію з чикунгуньєю перевіряємо за 14 і за 7 днів до вильоту; погоду й морські попередження — щодня.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"h3\">Екстрена картка групи <small>в телефоні кожного + два паперові примірники<\u002Fsmall><\u002Fh3>\n    <div class=\"tablewrap\"><table class=\"table\">\n      <thead><tr><th style=\"width:38%\">Що<\u002Fth><th>Де збережено / значення<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td>Адреса й координати вілли<\u002Ftd><td><input class=\"blank\" data-store=\"sos.villa\" placeholder=\"—\"><\u002Ftd><\u002Ftr>\n        <tr><td>Телефон господаря<\u002Ftd><td><input class=\"blank\" data-store=\"sos.host\" placeholder=\"—\"><\u002Ftd><\u002Ftr>\n        <tr><td>Телефон страхової допомоги<\u002Ftd><td><input class=\"blank\" data-store=\"sos.insurance\" placeholder=\"—\"><\u002Ftd><\u002Ftr>\n        <tr><td>Найближча клініка<\u002Ftd><td><input class=\"blank\" data-store=\"sos.clinic\" placeholder=\"—\"><\u002Ftd><\u002Ftr>\n        <tr><td>Контакти оренди автомобілів<\u002Ftd><td><input class=\"blank\" data-store=\"sos.cars\" placeholder=\"—\"><\u002Ftd><\u002Ftr>\n        <tr><td>Кайт-станція / рятувальна служба<\u002Ftd><td><input class=\"blank\" data-store=\"sos.rescue\" placeholder=\"—\"><\u002Ftd><\u002Ftr>\n        <tr><td>Контакт людини в Україні<\u002Ftd><td><input class=\"blank\" data-store=\"sos.home\" placeholder=\"—\"><\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n  <\u002Fsection>\n\n  <hr class=\"rule\">\n  <section class=\"sec\" id=\"open\">\n    <span class=\"kicker\">Відкриті питання · єдине місце<\u002Fspan>\n    <h2 class=\"sec-title\">Закрили — переносимо результат у розділ<\u002Fh2>\n    <p class=\"lead\">Все невирішене живе тут, а не «десь у чаті». Дату можна посунути, власника — ні.<\u002Fp>\n\n    <div class=\"tablewrap\" style=\"margin-top: var(--leading)\"><table class=\"table\">\n      <thead><tr><th style=\"width:6%\">№<\u002Fth><th>Питання<\u002Fth><th style=\"width:30%\">Наступний крок<\u002Fth><th style=\"width:14%\">Хто<\u002Fth><th style=\"width:9%\">До<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td class=\"num\">1<\u002Ftd><td>Хто координатор плану?<\u002Ftd><td>Погодити імʼя<\u002Ftd><td><input class=\"blank\" data-store=\"q.1.who\" placeholder=\"—\"><\u002Ftd><td class=\"num\">10.08<\u002Ftd><\u002Ftr>\n        <tr><td class=\"num\">2<\u002Ftd><td>Чи безпечна й зручна вілла?<\u002Ftd><td>Надіслати лист господарю<\u002Ftd><td><input class=\"blank\" data-store=\"q.2.who\" placeholder=\"—\"><\u002Ftd><td class=\"num\">10.08<\u002Ftd><\u002Ftr>\n        <tr><td class=\"num\">3<\u002Ftd><td>Точні рейси, час і норми багажу?<\u002Ftd><td>Заповнити спільну табличку<\u002Ftd><td><input class=\"blank\" data-store=\"q.3.who\" placeholder=\"—\"><\u002Ftd><td class=\"num\">14.08<\u002Ftd><\u002Ftr>\n        <tr><td class=\"num\">4<\u002Ftd><td>Чи вміщують два авто людей і багаж?<\u002Ftd><td>Розміри або пробне завантаження<\u002Ftd><td><input class=\"blank\" data-store=\"q.4.who\" placeholder=\"—\"><\u002Ftd><td class=\"num\">17.08<\u002Ftd><\u002Ftr>\n        <tr><td class=\"num\">5<\u002Ftd><td>Кайти: остаточно орендуємо?<\u002Ftd><td>«Так» обох кайтерів + перевірена станція<\u002Ftd><td><input class=\"blank\" data-store=\"q.5.who\" placeholder=\"—\"><\u002Ftd><td class=\"num\">17.08<\u002Ftd><\u002Ftr>\n        <tr><td class=\"num\">6<\u002Ftd><td>Які страхові поліси?<\u002Ftd><td>Порівняти умови, кайтсерфінг письмово<\u002Ftd><td><input class=\"blank\" data-store=\"q.6.who\" placeholder=\"—\"><\u002Ftd><td class=\"num\">21.08<\u002Ftd><\u002Ftr>\n        <tr><td class=\"num\">7<\u002Ftd><td>Як ділимо витрати?<\u002Ftd><td>Підтвердити правила з розділу «Гроші»<\u002Ftd><td><input class=\"blank\" data-store=\"q.7.who\" placeholder=\"—\"><\u002Ftd><td class=\"num\">24.08<\u002Ftd><\u002Ftr>\n        <tr><td class=\"num\">8<\u002Ftd><td>Хто готовий водити?<\u002Ftd><td>Заповнити таблицю побажань<\u002Ftd><td><input class=\"blank\" data-store=\"q.8.who\" placeholder=\"—\"><\u002Ftd><td class=\"num\">24.08<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n\n    <h3 class=\"h3\">Офіційні джерела для повторної перевірки<\u002Fh3>\n    <div class=\"links\">\n      <a href=\"https://passport.govmu.org/passport/?page_id=587\" target=\"_blank\" rel=\"noopener\">Вимоги для вʼїзду на Маврикій<\u002Fa>\n      <a href=\"https://safemauritius.govmu.org/\" target=\"_blank\" rel=\"noopener\">Mauritius All-in-One Travel Form — єдина анкета мандрівника<\u002Fa>\n      <a href=\"https://www.mra.mu/index.php/eservices1/tourist-fee\" target=\"_blank\" rel=\"noopener\">Туристичний збір<\u002Fa>\n      <a href=\"https://www.mra.mu/index.php/customs1/travellers/13-customs/150-import-restrictions\" target=\"_blank\" rel=\"noopener\">Митні обмеження Маврикію<\u002Fa>\n      <a href=\"https://www.turkishairlines.com/en-int/any-questions/carry-on-baggage/\" target=\"_blank\" rel=\"noopener\">Turkish Airlines: ручна поклажа<\u002Fa>\n      <a href=\"https://www.turkishairlines.com/en-int/any-questions/sports-equipment/surfing/\" target=\"_blank\" rel=\"noopener\">Turkish Airlines: спорядження для серфінгу й кайтсерфінгу<\u002Fa>\n      <a href=\"https://metservice.intnet.mu/high-waves/high-waves-warning-system.php\" target=\"_blank\" rel=\"noopener\">Метеослужба Маврикію: попередження про високі хвилі<\u002Fa>\n      <a href=\"https://www.who.int/docs/default-source/coronaviruse/situation-reports/who-rapid-risk-assessment---chikungunya-virus-disease--global-v.2.pdf?download=true&amp;sfvrsn=eaa59cfc_3\" target=\"_blank\" rel=\"noopener\">ВООЗ: оцінка ризику чикунгуньї<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer>Єдиний актуальний план · зібрано з дослідження й робочого плану v0.5 · оновлено 5 серпня 2026.<br>Галочки та вписані імена зберігаються лише в браузері цього пристрою — ключові рішення дублюйте в чат.<\u002Ffooter>\n<\u002Fdiv>\n<script src=\"2096deb1-dde2-4ea3-bb34-bd5fcfd763f9\"><\u002Fscript>\n<script>\n(() => {\n  const K = 'mru26.';\n  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');\n  const today = new Date(); const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());\n  const DEP = new Date(2026, 8, 27), ISL = new Date(2026, 8, 28), HOME = new Date(2026, 9, 13);\n  const day = 86400000;\n\n  // — phase: countdown / trip-day / done —\n  const num = document.getElementById('stat-days'), lab = document.getElementById('stat-days-label');\n  const cta = document.getElementById('nav-cta');\n  const dniv = n => { const a = n % 10, b = n % 100;\n    if (a === 1 && b !== 11) return 'день до виїзду';\n    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return 'дні до виїзду';\n    return 'днів до виїзду'; };\n  if (t0 < DEP) {\n    const n = Math.round((DEP - t0) / day);\n    num.textContent = n; lab.textContent = dniv(n);\n  } else if (t0 <= HOME) {\n    if (+t0 === +DEP) { num.textContent = '0'; lab.textContent = 'день дороги — летимо'; }\n    else if (+t0 === +HOME) { num.textContent = '15+'; lab.textContent = 'дорога додому'; }\n    else { num.textContent = (Math.round((t0 - ISL) / day) + 1) + ' з 15'; lab.textContent = 'день на острові'; }\n    const row = document.querySelector('#days tr[data-date=\"' + iso(t0) + '\"]');\n    if (row) { row.classList.add('today'); cta.textContent = 'Сьогодні'; cta.href = '#' + row.id; }\n  } else {\n    num.textContent = '14'; lab.textContent = 'ночей, за якими сумуємо';\n  }\n\n  // — checklists: toggle + persist —\n  document.querySelectorAll('li[data-check]').forEach(li => {\n    const key = K + 'check.' + li.dataset.check;\n    const sync = on => { li.classList.toggle('done', on); li.setAttribute('aria-checked', on); };\n    li.setAttribute('role', 'checkbox'); li.tabIndex = 0;\n    sync(localStorage.getItem(key) === '1');\n    const flip = () => { const on = !li.classList.contains('done'); sync(on);\n      on ? localStorage.setItem(key, '1') : localStorage.removeItem(key); };\n    li.addEventListener('click', flip);\n    li.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });\n  });\n\n  // — editable blanks: persist —\n  document.querySelectorAll('input[data-store]').forEach(inp => {\n    const key = K + 'field.' + inp.dataset.store;\n    const v = localStorage.getItem(key); if (v !== null) inp.value = v;\n    inp.addEventListener('input', () => { inp.value ? localStorage.setItem(key, inp.value) : localStorage.removeItem(key); });\n  });\n\n  // — deadline timeline: mute past dates —\n  document.querySelectorAll('.tl-item[data-due]').forEach(el => {\n    if (t0 > new Date(el.dataset.due + 'T00:00:00')) el.classList.add('past');\n  });\n\n  // — copy the host letter —\n  const copyBtn = document.getElementById('copy-letter');\n  if (copyBtn) copyBtn.addEventListener('click', () => {\n    const det = document.querySelector('#villa details'); if (det) det.open = true;\n    const txt = document.getElementById('letter-text').innerText;\n    navigator.clipboard.writeText(txt).then(() => {\n      copyBtn.textContent = 'Скопійовано ✓';\n      setTimeout(() => { copyBtn.textContent = 'Скопіювати лист'; }, 2200);\n    });\n  });\n\n  // — scrollspy —\n  const secs = document.querySelectorAll('section[id]');\n  const links = new Map([...document.querySelectorAll('.nav-links a')].map(a => [a.getAttribute('href').slice(1), a]));\n  const spy = new IntersectionObserver(es => {\n    es.forEach(e => { if (e.isIntersecting) {\n      links.forEach(a => a.removeAttribute('aria-current'));\n      const a = links.get(e.target.id); if (a) a.setAttribute('aria-current', 'location');\n    } });\n  }, { rootMargin: '-30% 0px -60% 0px' });\n  secs.forEach(s => { if (links.has(s.id)) spy.observe(s); });\n\n  // — baseline overlay (review aid) —\n  if (new URLSearchParams(location.search).has('baselines')) document.body.setAttribute('data-baselines', '');\n  addEventListener('keydown', e => {\n    const t = e.target;\n    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;\n    if ((e.key === 'b' || e.key === 'B') && !e.metaKey && !e.ctrlKey && !e.altKey) document.body.toggleAttribute('data-baselines');\n  });\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
